spring:
  data:
    redis:
      host: localhost
      port: 6379
  datasource:
    url: jdbc:postgresql://localhost:5432/people
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
  application:
    name: chirp
app:
  security:
    api-key-header: X-API-KEY
    api-key: "your-super-secure-secret-api-key-here"